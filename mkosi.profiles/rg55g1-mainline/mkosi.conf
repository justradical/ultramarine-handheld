[Output]
ImageId=rg55g1-mainline
Format=disk
Output=ultramarine-rg55g1-mainline
OutputDirectory=../../build
Seed=5f6b0a5e-2b1c-4f59-9a3e-6e1d2c7a4b81

[Content]
# The RG 55G1 boots through UEFI firmware: systemd-boot on the ESP loads the
# kernel, initrd and board DTB directly. The ROCKNIX ABL is not used.
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=no
# Storage, display and the SoC core are built in; the initrd needs no modules.
KernelModulesInitrd=no
Devicetrees=qcom/sm4450-anbernic-rg55g1.dtb
PackageDirectories=../../build/anda-rpms
Packages=kernel-rg55g1,kernel-rg55g1-core,kernel-rg55g1-modules
Packages=systemd-boot-unsigned,mtools
Packages=zram-generator-defaults
BuildPackages=mtools

Initrds=default
InitrdPackages=systemd,systemd-udev,kmod,util-linux,e2fsprogs
