[Partition]
# Fixed PARTUUID, referenced by root= in /etc/kernel/cmdline: Qualcomm UEFI
# often lacks runtime variable support, so gpt-auto root discovery through
# LoaderDevicePartUUID cannot be relied on. On first boot systemd-repart grows
# this partition into the rest of the card.
Type=root
UUID=158d8d6e-c5d7-44b1-b8e8-f16253220963
Label=root
Format=ext4
CopyFiles=/
Minimize=guess
GrowFileSystem=yes
