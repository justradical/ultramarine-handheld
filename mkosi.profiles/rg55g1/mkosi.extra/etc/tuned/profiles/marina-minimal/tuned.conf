# RG55G1 idle profile, used only while the graphical workload is frozen.
# SM4450 clocks are firmware-managed (cpufreq-hw, GMU), so pin the governors
# rather than fixed frequencies.

[main]
summary=Minimum RG55G1 idle clocks

[cpu]
governor=powersave
energy_perf_bias=powersave|power
energy_performance_preference=power
boost=0
