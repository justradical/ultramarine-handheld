[Output]
ImageId=rg55g1

# ESP + root. The board boots through UEFI, so systemd-boot on the ESP loads
# the kernel, initrd and device tree; no Android/ABL boot image is involved.
RepartDirectories=image/repart.d
SectorSize=512

[Boot]
Bootable=no
Bootloader=none

[Content]
Packages=
    alsa-ucm
    qcom-firmware
    atheros-firmware
    bluez
ExtraTrees=image/repart.d:/usr/lib/repart.d
PostInstallationScripts=scripts/mkosi.postinst.chroot
FinalizeScripts=scripts/mkosi.finalize.chroot
